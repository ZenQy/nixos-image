name: Build image files
on:
  workflow_dispatch:
    inputs:
      address:
        description: "vps的ip地址"
        required: true
        default: "10.0.0.10/24"
        type: string
      gateway:
        description: "vps的网关"
        required: true
        default: "10.0.0.1"
        type: string
      device:
        type: choice
        description: "硬盘类型，vda/sda"
        options:
          - vda
          - sda
        required: true
        default: vda

env:
  NIX_PATH: nixpkgs=channel:nixos-unstable
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: SSH Private Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install nixFlake
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-public-keys = zenqy.cachix.org-1:G5csLBsu/kQIOXU7XUiqeMacwzN1WQWv0+GysTVmJgo= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://zenqy.cachix.org/ https://cache.nixos.org/

      - name: Run Nix Flake Update
        run: nix flake update

      - name: Commit and Push
        run: |
          if [[ $(git diff flake.lock | wc -l) > 0 ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add flake.lock
            git commit -m "Update flake.lock - Automated Commit"
            git push
          fi

      - name: Set Config
        run: |
          sed -i 's|10.0.0.10/24|${{ inputs.address }}|g' vps/default.nix
          sed -i 's|10.0.0.1|${{ inputs.gateway }}|g' vps/default.nix
          echo "GATEWAY=${{ inputs.gateway }}" >> $GITHUB_ENV

          if [[ ${{ inputs.device }} == 'sda' ]]; then
            sed -i 's|/dev/vda|/dev/sda|g' vps/default.nix
          fi

      - name: build image
        run: |
          echo "DATE=$(date +"%Y.%m%d.%H%M")" >> $GITHUB_ENV
          nix build .#vps

      - name: Upload Image To Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: v${{ env.DATE }}
          artifacts: "result/*.img.zst"
          body: |
            Gateway:${{ env.GATEWAY }}

      - name: Delete releases and workflows runs
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_workflows: true
          workflows_keep_day: 30
          gh_token: ${{ github.token }}
